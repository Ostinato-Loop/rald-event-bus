name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-event-bus
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (events.rald.cloud)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Apply Supabase schema (idempotent DDL via Management API)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "WARN: SUPABASE_ACCESS_TOKEN not set — skipping DDL migration"
            exit 0
          fi
          SQL=$(cat supabase-full-schema.sql 2>/dev/null || echo "")
          if [ -z "$SQL" ]; then echo "No schema file — skipping"; exit 0; fi
          STATUS=$(echo "$SQL" \
            | python3 -c 'import json,sys; print(json.dumps({"query": sys.stdin.read()}))' \
            | curl -sf -o /tmp/mg_out.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/onxdcikfttdmnhofsuwo/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @- \
          )
          cat /tmp/mg_out.json || true
          echo "Supabase DDL: HTTP $STATUS"

      - name: Resolve KV namespace IDs via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const h = {
            'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json'
          };
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces`;
          async function listAll() {
            const r = await fetch(`${base}?per_page=100`, { headers: h });
            const d = await r.json();
            if (!d.success) throw new Error(JSON.stringify(d.errors));
            return d.result;
          }
          async function resolveId(title) {
            const all = await listAll();
            const existing = all.find(n => n.title === title);
            if (existing) { console.log(`  [existing] ${title}`); return existing.id; }
            const r = await fetch(base, { method: 'POST', headers: h, body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!d.success) {
              const retry = (await listAll()).find(n => n.title === title);
              if (retry) return retry.id;
              throw new Error(JSON.stringify(d.errors));
            }
            console.log(`  [created]  ${title}`);
            return d.result.id;
          }
          (async () => {
            const RATE_LIMIT_KV = await resolveId('rald-event-bus-rate-limit');
            const FLAG_CACHE_KV = await resolveId('rald-event-bus-flag-cache');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_ID', RATE_LIMIT_KV);
            toml = toml.replace('REPLACE_WITH_FLAG_CACHE_KV_ID',  FLAG_CACHE_KV);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched with real KV IDs.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Deploy rald-event-bus Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push SUPABASE_SERVICE_ROLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY && echo "SUPABASE_SERVICE_ROLE_KEY ✓" || echo "WARN: not set"

      - name: Push RALD_JWT_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_JWT_SECRET && echo "RALD_JWT_SECRET ✓" || echo "WARN: not set"

      - name: Push RALD_INTERNAL_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_INTERNAL_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_INTERNAL_SECRET && echo "RALD_INTERNAL_SECRET ✓" || echo "WARN: RALD_INTERNAL_SECRET not set (legacy — OK)"

      - name: Push MACHINE_KEY_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_ID && echo "MACHINE_KEY_ID ✓" || echo "WARN: MACHINE_KEY_ID not set"

      - name: Push MACHINE_KEY_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_SECRET && echo "MACHINE_KEY_SECRET ✓" || echo "WARN: MACHINE_KEY_SECRET not set"

      - name: Smoke test events.rald.cloud/health
        continue-on-error: true
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://events.rald.cloud/health || echo "000")
          echo "events.rald.cloud/health HTTP $STATUS"
          [ "$STATUS" = "200" ] || echo "WARNING: expected 200, got $STATUS"

      - name: Audit log
        if: always()
        run: echo "AUDIT: service=rald-event-bus commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
