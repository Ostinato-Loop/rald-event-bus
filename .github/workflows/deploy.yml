name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-event-bus
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (events.rald.cloud)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Apply Supabase schema (idempotent DDL via Management API)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "WARNING: SUPABASE_ACCESS_TOKEN not set — skipping schema migration"
            echo "Add your Supabase personal access token from https://supabase.com/dashboard/account/tokens"
            exit 0
          fi
          SQL=$(cat supabase-full-schema.sql)
          STATUS=$(curl -sf -o /tmp/mg_out.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/onxdcikfttdmnhofsuwo/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
          )
          cat /tmp/mg_out.json || true
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
            echo "Schema migration applied ✓ (HTTP $STATUS)"
          else
            echo "WARNING: schema migration returned HTTP $STATUS — may already be applied (IF NOT EXISTS)"
          fi

      - name: Resolve KV namespace IDs via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const h = {
            'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json'
          };
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces`;
          async function listAll() {
            const r = await fetch(`${base}?per_page=100`, { headers: h });
            const d = await r.json();
            if (!d.success) throw new Error(JSON.stringify(d.errors));
            return d.result;
          }
          async function resolveId(title) {
            const all = await listAll();
            const existing = all.find(n => n.title === title);
            if (existing) { console.log(`  [existing] ${title}`); return existing.id; }
            const r = await fetch(base, { method: 'POST', headers: h, body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!d.success) {
              const retry = (await listAll()).find(n => n.title === title);
              if (retry) return retry.id;
              throw new Error(JSON.stringify(d.errors));
            }
            console.log(`  [created]  ${title}`);
            return d.result.id;
          }
          (async () => {
            const RATE_LIMIT_KV = await resolveId('rald-event-bus-rate-limit');
            const FLAG_CACHE_KV = await resolveId('rald-event-bus-flag-cache');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_ID', RATE_LIMIT_KV);
            toml = toml.replace('REPLACE_WITH_FLAG_CACHE_KV_ID',  FLAG_CACHE_KV);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched with real KV IDs.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Deploy rald-event-bus Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure events.rald.cloud DNS record exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
          const h={'Authorization':'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          (async()=>{
            const z=await fetch('https://api.cloudflare.com/client/v4/zones?name=rald.cloud',{headers:h}).then(r=>r.json());
            const zid=z.result?.[0]?.id; if(!zid){console.log('zone not found');return;}
            const ex=await fetch('https://api.cloudflare.com/client/v4/zones/'+zid+'/dns_records?name=events.rald.cloud',{headers:h}).then(r=>r.json());
            if(ex.result?.length){console.log('events DNS exists');return;}
            const r=await fetch('https://api.cloudflare.com/client/v4/zones/'+zid+'/dns_records',{method:'POST',headers:h,body:JSON.stringify({type:'AAAA',name:'events',content:'100::',proxied:true})}).then(r=>r.json());
            console.log(r.success?'Created events.rald.cloud AAAA 100::':'DNS error:'+JSON.stringify(r.errors));
          })().catch(e=>console.error('[WARN]',e.message));
          "

      - name: Push secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
          RALD_INTERNAL_SECRET: ${{ secrets.RALD_INTERNAL_SECRET }}
          MACHINE_KEY_ID: ${{ secrets.MACHINE_KEY_ID }}
          MACHINE_KEY_SECRET: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          echo "$RALD_JWT_SECRET"           | npx wrangler secret put RALD_JWT_SECRET
          echo "$RALD_INTERNAL_SECRET"      | npx wrangler secret put RALD_INTERNAL_SECRET
          if [ -n "$MACHINE_KEY_ID" ]; then
            echo "$MACHINE_KEY_ID"     | npx wrangler secret put MACHINE_KEY_ID
            echo "$MACHINE_KEY_SECRET" | npx wrangler secret put MACHINE_KEY_SECRET
            echo "MACHINE_KEY_ID + MACHINE_KEY_SECRET ✓"
          else
            echo "WARNING: MACHINE_KEY_ID not set — machine auth unavailable on event bus"
          fi

      - name: Smoke test events.rald.cloud/health
        continue-on-error: true
        run: |
          sleep 8
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://events.rald.cloud/health || echo "000")
          echo "events.rald.cloud/health HTTP $STATUS"
          [ "$STATUS" = "200" ] || echo "WARNING: expected 200, got $STATUS"

      - name: Audit log
        if: always()
        run: echo "AUDIT: service=rald-event-bus commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
