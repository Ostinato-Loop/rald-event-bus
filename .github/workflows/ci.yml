name: CI
on:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run lint
        continue-on-error: true
