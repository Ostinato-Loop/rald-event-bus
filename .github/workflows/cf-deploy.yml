name: CF Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-event-bus
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (events.rald.cloud)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Apply Supabase schema (idempotent DDL via Management API)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "WARN: SUPABASE_ACCESS_TOKEN not set - skipping DDL migration"
            exit 0
          fi
          SQL=$(cat supabase-full-schema.sql 2>/dev/null || echo "")
          if [ -z "$SQL" ]; then echo "No schema file - skipping"; exit 0; fi
          PAYLOAD=$(node -e "const sql=require('fs').readFileSync('supabase-full-schema.sql','utf8');process.stdout.write(JSON.stringify({query:sql}))")
          STATUS=$(echo "$PAYLOAD" \
            | curl -sf -o /tmp/mg_out.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/onxdcikfttdmnhofsuwo/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d @- \
          )
          cat /tmp/mg_out.json || true
          echo "Supabase DDL: HTTP $STATUS"

      - name: Resolve KV namespace IDs via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/resolve-kv-ids.js

      - name: Deploy rald-event-bus Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push SUPABASE_SERVICE_ROLE_KEY
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY && echo "SUPABASE_SERVICE_ROLE_KEY OK" || echo "WARN: not set"

      - name: Push RALD_JWT_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_JWT_SECRET && echo "RALD_JWT_SECRET OK" || echo "WARN: not set"

      - name: Push RALD_INTERNAL_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.RALD_INTERNAL_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put RALD_INTERNAL_SECRET && echo "RALD_INTERNAL_SECRET OK" || echo "WARN: RALD_INTERNAL_SECRET not set (legacy - OK)"

      - name: Push MACHINE_KEY_ID
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_ID }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_ID && echo "MACHINE_KEY_ID OK" || echo "WARN: MACHINE_KEY_ID not set"

      - name: Push MACHINE_KEY_SECRET
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VAL: ${{ secrets.MACHINE_KEY_SECRET }}
        run: |
          [ -n "$SECRET_VAL" ] && echo "$SECRET_VAL" | npx wrangler secret put MACHINE_KEY_SECRET && echo "MACHINE_KEY_SECRET OK" || echo "WARN: MACHINE_KEY_SECRET not set"

      - name: Smoke test events.rald.cloud/health
        continue-on-error: true
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://events.rald.cloud/health || echo "000")
          echo "events.rald.cloud/health HTTP $STATUS"
          [ "$STATUS" = "200" ] || echo "WARNING: expected 200, got $STATUS"

      - name: Audit log
        if: always()
        run: echo "AUDIT service=rald-event-bus commit=${{ github.sha }} actor=${{ github.actor }} ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) status=${{ job.status }}"
