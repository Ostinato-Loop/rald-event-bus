name = "rald-event-bus"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = []

[vars]
ENVIRONMENT     = "production"
SERVICE_NAME    = "rald-event-bus"
SERVICE_VERSION = "2.1.0"
SUPABASE_URL    = "https://onxdcikfttdmnhofsuwo.supabase.co"

# Downstream service URLs — used by identity provisioning chain
PAYRALD_CORE_URL = "https://core.pay.rald.cloud"
ROUTING_URL      = "https://routing.rald.cloud"
NOTIFY_URL       = "https://notify.rald.cloud"
MESSENGER_URL    = "https://messenger.rald.cloud"

[[routes]]
pattern = "events.rald.cloud/*"
zone_name = "rald.cloud"

# KV IDs patched at deploy time by CI — do NOT hardcode here
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "FLAG_CACHE_KV"
id = "REPLACE_WITH_FLAG_CACHE_KV_ID"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — wrangler secret put:
#   SUPABASE_SERVICE_ROLE_KEY  RALD_JWT_SECRET  RALD_INTERNAL_SECRET
